name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "milestone/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Vitest
        run: npm test

      - name: Build TypeScript workspaces
        run: |
          npm run build --workspace=@origin-duel/domain
          npm run build --workspace=@origin-duel/contracts-abi
          npm run build --workspace=@origin-duel/test-fixtures
          npm run build --workspace=@origin-duel/backend
          npm run build --workspace=@origin-duel/renderer
          npm run build --workspace=@origin-duel/web

      - name: Build web application
        run: npm exec --workspace=@origin-duel/web -- vite build

      - name: Check and test contracts
        working-directory: contracts
        run: |
          forge fmt --check
          forge build
          forge test

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build backend image
        run: docker build --file apps/backend/Dockerfile --tag origin-duel-backend:ci .

      - name: Build renderer image
        run: docker build --platform linux/amd64 --file apps/renderer/Dockerfile --tag origin-duel-renderer:ci .
